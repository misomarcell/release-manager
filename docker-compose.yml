services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: movieapp
      POSTGRES_PASSWORD: movieapp
      POSTGRES_DB: movieapp
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - '127.0.0.1:5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U movieapp']
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: .
      target: backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://movieapp:movieapp@db:5432/movieapp
      PORT: '3000'
      NODE_ENV: production
    expose:
      - '3000'
    networks:
      - default
      - media
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      target: frontend
    restart: unless-stopped
    environment:
      PORT: '8085'
      BACKEND_URL: http://backend:3000
      NG_ALLOWED_HOSTS: ${NG_ALLOWED_HOSTS:-localhost}
    ports:
      - '8085:8085'
    depends_on:
      - backend

  pgadmin:
    image: dpage/pgadmin4:latest
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@local.dev
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_LISTEN_PORT: '5050'
    ports:
      - '127.0.0.1:5050:5050'
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:

networks:
  media:
    external: true
