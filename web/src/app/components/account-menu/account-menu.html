<button class="avatar pressable" type="button" [matMenuTriggerFor]="menu" aria-label="Account menu">
    {{ initial() }}
</button>

<mat-menu #menu="matMenu">
    <div class="who">{{ auth.username() }}</div>
    @if (auth.admin()) {
        <a mat-menu-item routerLink="/users">
            <mat-icon>group</mat-icon>
            <span>Manage Users</span>
        </a>
        <a mat-menu-item routerLink="/settings">
            <mat-icon>tune</mat-icon>
            <span>Settings</span>
        </a>
        <a mat-menu-item routerLink="/admin">
            <mat-icon>admin_panel_settings</mat-icon>
            <span>Administration</span>
        </a>
        <a mat-menu-item routerLink="/logs">
            <mat-icon>receipt_long</mat-icon>
            <span>Logs</span>
        </a>
    }
    <mat-divider />
    <button mat-menu-item (click)="logout()">
        <mat-icon>logout</mat-icon>
        <span>Sign out</span>
    </button>
    @if (version.commitHash()) {
        <a class="version mono" [href]="version.commitUrl()" target="_blank" rel="noopener">
            {{ version.commitHash() }}
            @if (version.commitDate(); as date) {
                · {{ date | date: 'yyyy-MM-dd HH:mm' }}
            }
        </a>
    }
</mat-menu>
