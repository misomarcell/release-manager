<button mat-icon-button [matMenuTriggerFor]="mediaActionsMenu" aria-label="Media actions">
    <mat-icon>more_horiz</mat-icon>
</button>
<mat-menu #mediaActionsMenu="matMenu">
    @if (imdbId()) {
        <a mat-menu-item [href]="'https://www.imdb.com/title/' + imdbId()" target="_blank" rel="noopener">
            <mat-icon svgIcon="imdb"></mat-icon>
            <span>Open IMDb page</span>
        </a>
    }
    @if (trailerKey()) {
        <a mat-menu-item [href]="'https://www.youtube.com/watch?v=' + trailerKey()" target="_blank" rel="noopener">
            <mat-icon svgIcon="youtube"></mat-icon>
            <span>Watch Trailer</span>
        </a>
    }
    @if (wokeUrl(); as url) {
        <a mat-menu-item [href]="url" target="_blank" rel="noopener">
            <mat-icon>fact_check</mat-icon>
            <span>Is It Woke?</span>
        </a>
    }
    @if (jellyfinUrl(); as url) {
        <a mat-menu-item [href]="url" target="_blank" rel="noopener">
            <mat-icon>play_circle</mat-icon>
            <span>Open in Jellyfin</span>
        </a>
    }

    @if (canBeDeleted()) {
        <mat-divider />
        <button
            mat-menu-item
            class="delete-menu-item"
            [disabled]="deleteActionDisabled()"
            (click)="deleteAction.emit()"
        >
            <mat-icon>delete</mat-icon>
            <span>Delete item</span>
        </button>
    }
</mat-menu>
