<div class="search-bar">
  <mat-form-field appearance="outline" subscriptSizing="dynamic" class="search-input">
    <input
      matInput
      [(ngModel)]="searchQuery"
      (keydown.enter)="onSearch()"
      placeholder="Search movies, TV shows..."
    />
    <mat-icon matPrefix>search</mat-icon>
    @if (searchQuery) {
      <button mat-icon-button matSuffix (click)="clearAndSearch()" aria-label="Clear">
        <mat-icon>close</mat-icon>
      </button>
    }
  </mat-form-field>
  <button
    mat-icon-button
    [matMenuTriggerFor]="filterMenu"
    class="filter-btn"
    [matBadge]="activeFilterCount()"
    [matBadgeHidden]="activeFilterCount() === 0"
    matBadgeColor="primary"
  >
    <mat-icon>tune</mat-icon>
  </button>
  <mat-menu #filterMenu="matMenu">
    <div class="filter-section-label" mat-menu-item disabled>Category</div>
    @for (cat of categories; track cat.key) {
      <button mat-menu-item (click)="onCategorySelect(cat.key)">
        @if (selectedCategory() === cat.key) {
          <mat-icon>check</mat-icon>
        }
        <span>{{ cat.label }}</span>
      </button>
    }
    <mat-divider />
    <div class="filter-section-label" mat-menu-item disabled>Quality</div>
    <button mat-menu-item (click)="onUhdToggle($event)">
      @if (uhdOnly()) {
        <mat-icon>check</mat-icon>
      }
      <span>4K only</span>
    </button>
  </mat-menu>
</div>
