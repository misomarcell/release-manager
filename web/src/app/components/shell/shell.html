<nav class="nav" aria-label="Main">
    @for (item of navItems; track item.path) {
        <a
            class="item"
            [routerLink]="item.path"
            routerLinkActive="active"
            ariaCurrentWhenActive="page"
            #link="routerLinkActive"
            [attr.aria-label]="
                item.showsUnread && watchlist.unreadCount()
                    ? item.label + ', ' + watchlist.unreadCount() + ' new releases'
                    : null
            "
        >
            <span class="pill pressable">
                <mat-icon [class.filled]="link.isActive" aria-hidden="true">{{ item.icon }}</mat-icon>
                @if (item.showsUnread && watchlist.unreadCount(); as count) {
                    <span class="count num" aria-hidden="true">{{ count }}</span>
                }
            </span>
            {{ item.label }}
        </a>
    }
    <span class="spacer"></span>
    <app-account-menu class="desktop-only" />
</nav>

<div class="content">
    <router-outlet />
</div>
