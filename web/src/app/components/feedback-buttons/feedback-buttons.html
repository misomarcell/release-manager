<button
    class="feedback-btn like"
    [class.active]="currentFeedback() === 'like'"
    [disabled]="submitting()"
    (click)="sendFeedback('like')"
    aria-label="Liked it"
>
    <mat-icon>thumb_up</mat-icon>
</button>
<button
    class="feedback-btn dislike"
    [class.active]="currentFeedback() === 'dislike'"
    [disabled]="submitting()"
    (click)="sendFeedback('dislike')"
    aria-label="Dislike"
>
    <mat-icon>thumb_down</mat-icon>
</button>
