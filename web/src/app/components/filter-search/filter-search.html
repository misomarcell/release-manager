<div class="search" role="search">
    <mat-icon aria-hidden="true">search</mat-icon>
    <input
        #field
        type="search"
        enterkeyhint="search"
        autocomplete="off"
        [value]="searchQuery()"
        [placeholder]="placeholder()"
        [attr.aria-label]="placeholder()"
        (input)="searchQuery.set(field.value)"
        (keydown.enter)="submit()"
    />
    @if (searchQuery()) {
        <button mat-icon-button type="button" aria-label="Clear search" (click)="clear()">
            <mat-icon>close</mat-icon>
        </button>
    }
    <ng-content select="[trailing]" />
    <app-account-menu class="phone-only" />
</div>

@if (filters().length > 0) {
    <div class="chips filters" role="group" aria-label="Filters">
        @for (filter of filters(); track filter.key; let first = $first) {
            @if (!first) {
                <i class="divider"></i>
            }
            @for (option of filter.options; track option.value) {
                @let on = isOn(filter, option);
                <button
                    class="chip pressable"
                    type="button"
                    [class.on]="on"
                    [attr.aria-pressed]="on"
                    (click)="choose(filter, option)"
                >
                    @if (on) {
                        <mat-icon aria-hidden="true">check</mat-icon>
                    }
                    {{ option.label }}
                </button>
            }
        }
    </div>
}
