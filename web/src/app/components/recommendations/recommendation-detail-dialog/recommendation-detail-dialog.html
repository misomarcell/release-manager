<h2 mat-dialog-title class="dialog-title">{{ rec.title }}</h2>
<mat-dialog-content>
    <div class="dialog-layout">
        @if (rec.poster) {
            <img class="dialog-poster" [src]="rec.poster" [alt]="rec.title" (click)="openPoster()" />
        }
        <div class="dialog-info">
            <span class="dialog-badge">{{ rec.mediaType === 'tv' ? 'TV Show' : 'Movie' }}</span>
            <p class="dialog-meta">
                @if (rec.year) {
                    {{ rec.year }}
                }
                @if (rec.rating) {
                    · ⭐ {{ rec.rating }}
                }
            </p>
            @if (rec.genre) {
                <p class="dialog-genre">{{ rec.genre }}</p>
            }
            <app-media-action-chips [imdbId]="rec.imdbId" [trailerKey]="rec.trailerKey" />
        </div>
    </div>
    @if (rec.plot) {
        <p class="dialog-plot">{{ rec.plot }}</p>
    }
    @if (rec.reason) {
        <p class="dialog-reason">
            <mat-icon class="reason-icon">auto_awesome</mat-icon>
            {{ rec.reason }}
        </p>
    }
</mat-dialog-content>
<mat-dialog-actions>
    <div class="dialog-feedback-row">
        <app-feedback-buttons
            [tmdbId]="rec.tmdbId"
            [mediaType]="rec.mediaType"
            [title]="rec.title"
            [genre]="rec.genre"
            [year]="rec.year"
            [plot]="rec.plot"
        />
    </div>
    <button mat-button class="search-btn" (click)="searchAndClose()">
        <mat-icon>search</mat-icon>
        <span class="btn-label">Search for "{{ rec.title }}"</span>
    </button>
    <button mat-button mat-dialog-close class="close-btn">Close</button>
</mat-dialog-actions>
