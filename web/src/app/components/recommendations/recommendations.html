<main class="container">
    <div class="mode-switcher" role="tablist" aria-label="Recommendation view">
        <a
            mat-button
            routerLink="trending"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: true }"
            #trendingActive="routerLinkActive"
            class="mode-button"
            [attr.aria-selected]="trendingActive.isActive"
            role="tab"
        >
            <mat-icon>local_fire_department</mat-icon>
            <span>Trending</span>
        </a>
        <a
            mat-button
            routerLink="personalized"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: true }"
            #personalizedActive="routerLinkActive"
            class="mode-button"
            [attr.aria-selected]="personalizedActive.isActive"
            role="tab"
        >
            <mat-icon>auto_awesome</mat-icon>
            <span>Personalized</span>
        </a>
    </div>

    <router-outlet />
</main>
