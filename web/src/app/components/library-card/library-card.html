@let i = item();
<mat-expansion-panel (opened)="onPanelOpened()">
  <mat-expansion-panel-header>
    <div class="card-summary">
      <div class="poster-thumb">
        @if (i.poster) {
          <img [src]="i.poster" [alt]="i.title" loading="lazy" (click)="openPoster($event)" />
        } @else {
          <div class="no-poster">
            <mat-icon>{{ i.mediaType === 'tv' ? 'tv' : 'movie' }}</mat-icon>
          </div>
        }
      </div>
      <div class="card-info">
        <span class="title">{{ i.title }}</span>
        <span class="meta">
          @if (i.year) {
            {{ i.year }}
          }
          @if (i.rating) {
            · ⭐ {{ i.rating }}
          }
          @if (i.genre) {
            · {{ i.genre }}
          }
        </span>
      </div>
    </div>
  </mat-expansion-panel-header>

  <mat-divider />

  <div class="card-details">
    <app-media-details
      [tmdbId]="i.tmdbId"
      [mediaType]="i.mediaType"
      [detail]="detail()"
      [detailLoading]="detailLoading()"
      [imdbId]="detail()?.imdbId ?? ''"
      [title]="i.title"
      [genre]="i.genre ?? ''"
      [year]="i.year ?? ''"
    />

    @if (jellyfinUrl()) {
      <div class="jellyfin-link-row">
        <a [href]="jellyfinUrl()!" target="_blank" rel="noopener" mat-button (click)="$event.stopPropagation()">
          <mat-icon>open_in_new</mat-icon>
          Open in Jellyfin
        </a>
      </div>
    }
  </div>
</mat-expansion-panel>
