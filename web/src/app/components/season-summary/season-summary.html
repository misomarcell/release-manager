<div class="header">
    <span class="title">
        <mat-icon>video_library</mat-icon>
        Seasons
    </span>
    <span class="totals">
        {{ seasonCount() }} {{ seasonCount() === 1 ? 'season' : 'seasons' }} · {{ episodeCount() }}
        {{ episodeCount() === 1 ? 'episode' : 'episodes' }}
    </span>
</div>
<div class="seasons">
    @for (season of seasons(); track season.seasonNumber) {
        <span class="season" [title]="season.episodeCount + ' episodes'">
            <span class="season-label">{{ seasonLabel(season) }}</span>
            <span class="episode-count">{{ season.episodeCount }} ep</span>
        </span>
    }
</div>
